# FROZEN TEST SET — written before any assistant code existed, and not edited after the first run.
# Tuning happens on dev.yaml only.
#
# lang:     ar-sa (Saudi dialect) · ar-msa (formal Arabic) · en
# expect:   answer   — the policy answers it; the reply must cite one of `sections` and contain
#                      every group in `facts` (each group lists acceptable spellings; numbers are
#                      matched as whole numbers after Arabic digits and thousands separators are
#                      normalised)
#           handoff  — must go to a person: complaint, compensation, an action on a specific
#                      booking or account, something the policy doesn't cover, an emergency,
#                      a legal threat, a request for an exception, or a request for a human
#           redirect — not a support question (greeting, thanks, unrelated)

